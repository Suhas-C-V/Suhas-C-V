<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 232" width="840" height="232" role="img" aria-label="Suhas C V — backend engineer. Animated pipeline: invoice.pdf to RabbitMQ to Go workers to Vertex AI to Temporal to validated.">
<style>
.n{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328;letter-spacing:-1px}
.s{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
.k{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#0a7ea4;letter-spacing:1.5px}
.p{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
.c{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}
.cur{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.pill{animation:pulse 6s linear infinite}
@keyframes pulse{0%,12%,100%{stroke:#d1d9e0}4%{stroke:#0a7ea4}}
@media (prefers-reduced-motion:reduce){.cur,.pill{animation:none}.dot{display:none}}
</style>
<rect x="0.5" y="0.5" width="839" height="231" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="24" y="40" class="k">$ whoami</text>
<text x="24" y="88" class="n">Suhas C V<tspan class="cur" fill="#0a7ea4">_</tspan></text>
<text x="24" y="116" class="s">Backend engineer · Java, Spring Boot &amp; Go · distributed, event-driven systems</text>
<line x1="136" y1="172.0" x2="704" y2="172.0" stroke="#d1d9e0" stroke-width="2" stroke-dasharray="3 5"/>
<circle class="dot" r="4" cx="-10" cy="172.0" fill="#b76e00"><animate attributeName="cx" from="80.0" to="760.0" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
<circle class="dot" r="4" cx="-10" cy="172.0" fill="#0a7ea4"><animate attributeName="cx" from="80.0" to="760.0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
<circle class="dot" r="4" cx="-10" cy="172.0" fill="#b76e00"><animate attributeName="cx" from="80.0" to="760.0" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
<rect x="24" y="150" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" class="pill" style="animation-delay:0.0s"/>
<text x="80.0" y="176.5" text-anchor="middle" class="p">invoice.pdf</text>
<text x="80.0" y="212" text-anchor="middle" class="c">in</text>
<rect x="160" y="150" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" class="pill" style="animation-delay:1.0s"/>
<text x="216.0" y="176.5" text-anchor="middle" class="p">RabbitMQ</text>
<text x="216.0" y="212" text-anchor="middle" class="c">queue</text>
<rect x="296" y="150" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" class="pill" style="animation-delay:2.0s"/>
<text x="352.0" y="176.5" text-anchor="middle" class="p">Go workers</text>
<text x="352.0" y="212" text-anchor="middle" class="c">parse</text>
<rect x="432" y="150" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" class="pill" style="animation-delay:3.0s"/>
<text x="488.0" y="176.5" text-anchor="middle" class="p">Vertex AI</text>
<text x="488.0" y="212" text-anchor="middle" class="c">agent</text>
<rect x="568" y="150" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5" class="pill" style="animation-delay:4.0s"/>
<text x="624.0" y="176.5" text-anchor="middle" class="p">Temporal</text>
<text x="624.0" y="212" text-anchor="middle" class="c">orchestrate</text>
<rect x="704" y="150" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
<text x="760.0" y="176.5" text-anchor="middle" class="p" style="fill:#1a7f37">✓ validated</text>
<text x="760.0" y="212" text-anchor="middle" class="c">done</text>
</svg>